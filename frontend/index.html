<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/insourcextechlogo.png" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the colour theme before first paint (no flash). Default: light.
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("insource-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#01030a");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Syncopate:wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Insource Bridge Technologies</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
